name: Sprint 11D - Dynamic scoped cloud preview

on:
  push:
    branches:
      - feat/ingestion-dynamic-cloud-tick
      - develop
    paths:
      - '.github/workflows/ingestion-dynamic-cloud-preview.yml'

permissions:
  contents: read

jobs:
  dynamic-tick:
    name: UTC scoped restore and offline preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install 'PyYAML>=6,<7' 'huggingface_hub>=1.16,<3'

      - name: Run targeted tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_ingestion_cloud_restore.py' -q
          python -m unittest discover -s tests -p 'test_ingestion_daily_cloud_workflow.py' -q

      - name: Resolve UTC window
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import datetime as dt
          import os

          today = dt.datetime.now(dt.timezone.utc).date()
          target = today - dt.timedelta(days=2)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"TICK_AS_OF={today.isoformat()}\n")
              env.write(f"SCOPE_DAY={target.isoformat()}\n")

          print("UTC AS-OF:", today)
          print("TARGET DAY:", target)
          PY

      - name: Restore selected OpenAQ day from Private Lake
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_READ_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo 'STOP: HF_READ_TOKEN missing'
            exit 1
          fi

          python -m src.ingestion.cloud_restore \
            --bucket CourseworkBigData/env-event-lake \
            --prefix lake/v1 \
            --scope-source openaq \
            --scope-day "$SCOPE_DAY" \
            --max-bytes 2097152 \
            --approve-download

      - name: Run dynamic offline cloud preview
        shell: bash
        run: |
          set -euo pipefail

          python -m src.ingestion.daily_cloud_workflow \
            --source openaq \
            --region HANOI \
            --sensor-id 21632 \
            --as-of "$TICK_AS_OF" \
            --lag-days 2 \
            --lookback-days 1 \
            --max-candidates 1 \
            --max-http-requests 3 \
            --max-bytes 2097152 \
            --max-cloud-bytes 4194304 \
            --bucket CourseworkBigData/env-event-lake \
            --prefix lake/v1 \
            | tee "$RUNNER_TEMP/dynamic-preview.log"

          grep -Fq 'DAILY CLOUD WORKFLOW: PREVIEW (offline_only)' \
            "$RUNNER_TEMP/dynamic-preview.log"

          grep -Fq 'DRY RUN ONLY' \
            "$RUNNER_TEMP/dynamic-preview.log"

          echo 'DYNAMIC CLOUD TICK: PREVIEW PASS'
