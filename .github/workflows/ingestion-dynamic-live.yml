name: Sprint 11D - Guarded dynamic OpenAQ live

# Push to develop is PREVIEW ONLY. Live acquisition is never a push or schedule.
# workflow_dispatch requires the file on the repository default branch.
on:
  push:
    branches: [feat/ingestion-dynamic-live-guarded, develop]
    paths:
      - '.github/workflows/ingestion-dynamic-live.yml'
      - 'tests/test_ingestion_cloud_live_ci.py'
      - 'tests/test_ingestion_dynamic_live_ci.py'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview by default; live_acquire requires two explicit confirmations'
        required: true
        type: choice
        default: preview
        options: [preview, live_acquire]
      approve_source_api:
        description: 'Authorize at most 3 OpenAQ requests for ONE UTC day'
        required: true
        type: boolean
        default: false
      approve_cloud_upload:
        description: 'Authorize verified Raw+Manifest upload to HF Private Lake'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Same single-writer group as the cloud-only publisher workflow (Sprint 11C-A).
# This does NOT guard any external laptop or another repository.
concurrency:
  group: environmental-event-cloud-tick-single-writer
  cancel-in-progress: false

jobs:
  one-day-openaq:
    if: >-
      ${{ github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/develop') }}
    name: Restore; review; optionally acquire and publish one OpenAQ day
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install 'PyYAML>=6,<7' 'huggingface_hub>=1.16,<3'
      - name: Verify live workflow guard tests
        run: |
          python -m unittest discover -s tests -p 'test_ingestion_cloud_live_ci.py' -q
          python -m unittest discover -s tests -p 'test_ingestion_dynamic_live_ci.py' -q
      - name: Refuse unconfirmed live request
        if: >-
          ${{ github.event_name == 'workflow_dispatch' &&
              inputs.mode == 'live_acquire' &&
              (inputs.approve_source_api != true || inputs.approve_cloud_upload != true) }}
        run: |
          echo 'STOP: Both approvals are required for live acquisition'
          exit 1
      - name: Resolve bounded UTC target
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode || 'preview' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import os

          today = dt.datetime.now(dt.timezone.utc).date()

          if (
              os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
              and os.environ.get("REQUESTED_MODE") == "live_acquire"
          ):
              target = dt.date(2026, 10, 22)

              if not (
                  dt.timedelta(days=2)
                  <= today - target
                  <= dt.timedelta(days=7)
              ):
                  raise SystemExit(
                      "STOP: reviewed pilot day outside safe UTC window"
                  )
          else:
              target = today - dt.timedelta(days=2)

          as_of = target + dt.timedelta(days=2)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"TICK_AS_OF={as_of.isoformat()}\n")
              f.write(f"SCOPE_DAY={target.isoformat()}\n")

          print("UTC AS-OF:", as_of)
          print("TARGET DAY:", target)
          PY

      - name: Restore previously published cloud state (read only)
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$HF_TOKEN" ]]; then
            echo 'STOP: HF_READ_TOKEN is not configured'
            exit 1
          fi
          python -m src.ingestion.cloud_restore \
            --bucket CourseworkBigData/env-event-lake --prefix lake/v1 \
            --approve-download --max-bytes 2097152 --scope-source openaq --scope-day "$SCOPE_DAY"
      - name: Restore verified OpenAQ location metadata (read only)
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_READ_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import tempfile
          from pathlib import Path

          from huggingface_hub import download_bucket_files

          bucket = "CourseworkBigData/env-event-lake"
          prefix = "lake/v1"
          raw_rel = "data/raw/openaq/locations/d6897a849fb938ce27a0.json"
          mf_rel = "data/raw/openaq/manifests/locations/d6897a849fb938ce27a0.manifest.json"

          expected_sha = (
              "1ae2d6f4b715ea46888a8bade781740"
              "e28b98595b09b9233cfe91909e17bf3b5"
          )

          with tempfile.TemporaryDirectory() as tempdir:
              tmp = Path(tempdir)
              raw_tmp = tmp / "metadata-raw"
              mf_tmp = tmp / "metadata-manifest"

              download_bucket_files(
                  bucket,
                  files=[
                      (f"{prefix}/{raw_rel}", str(raw_tmp)),
                      (f"{prefix}/{mf_rel}", str(mf_tmp)),
                  ],
              )

              raw = raw_tmp.read_bytes()
              mf = mf_tmp.read_bytes()

              if len(raw) != 1473 or len(mf) != 528:
                  raise RuntimeError("Metadata snapshot size mismatch")

              if hashlib.sha256(raw).hexdigest() != expected_sha:
                  raise RuntimeError("Metadata Raw SHA-256 mismatch")

              manifest = json.loads(mf)
              payload = json.loads(raw)

              if manifest.get("status") != "success":
                  raise RuntimeError("Metadata manifest is not successful")

              if (
                  manifest.get("start_utc") is not None
                  or manifest.get("end_utc") is not None
              ):
                  raise RuntimeError("Invalid metadata UTC contract")

              if expected_sha not in mf.decode("utf-8").lower():
                  raise RuntimeError("Manifest does not match Raw SHA-256")

              rows = payload.get("results", [])
              if len(rows) != 1 or rows[0].get("id") != 4946813:
                  raise RuntimeError("Unexpected location ID")

              location = rows[0]
              sensors = [
                  item for item in location.get("sensors", [])
                  if item.get("id") == 13502154
                  and item.get("parameter", {}).get("name") == "pm25"
              ]

              if len(sensors) != 1:
                  raise RuntimeError("Expected PM2.5 sensor missing")

              coords = location.get("coordinates", {})
              lat, lon = coords.get("latitude"), coords.get("longitude")

              if not (
                  type(lat) in (float, int)
                  and type(lon) in (float, int)
                  and 20.75 <= lat <= 21.25
                  and 105.5 <= lon <= 106.0
              ):
                  raise RuntimeError("Metadata outside HANOI bbox")

              for relative, content in (
                  (raw_rel, raw),
                  (mf_rel, mf),
              ):
                  path = Path(relative)
                  if path.exists():
                      if not path.is_file() or path.read_bytes() != content:
                          raise RuntimeError(
                              "Existing metadata differs; refusing overwrite"
                          )
                  else:
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(content)

              print("METADATA RESTORE: PASS")
              print("LOCATION: 4946813; SENSOR: 13502154")
              print("RAW SHA-256: PASS")
              print("OBJECTS: 2; BYTES VERIFIED: 2001")
              print("READ ONLY CLOUD; NO PROVIDER API")
          PY

      - name: Preview exactly one source/day, fail closed on HOLD
        shell: bash
        run: |
          set -euo pipefail
          python -m src.ingestion.daily_plan \
            --source openaq --region HANOI --sensor-id 13502154 \
            --as-of "$TICK_AS_OF" --lag-days 2 --lookback-days 1 \
            --max-candidates 1 --format json \
            > "$RUNNER_TEMP/openaq_one_day_plan.json"
          python - <<'PY'
          import json, os, datetime as dt
          from pathlib import Path
          doc = json.loads((Path(os.environ['RUNNER_TEMP']) / 'openaq_one_day_plan.json').read_text())
          decisions = doc['decisions']
          assert doc['as_of_utc'] == os.environ['TICK_AS_OF']
          assert doc['candidate_count'] in (0, 1) and len(decisions) == 1
          assert doc['state'] in ('ready_for_manual_review', 'nothing_to_do')
          assert all(d['action'] in ('candidate', 'skip') for d in decisions)
          assert decisions[0]['item']['source'] == 'openaq'
          assert decisions[0]['item']['sensor_id'] == 13502154
          assert decisions[0]['item']['start'] == os.environ['SCOPE_DAY']
          assert decisions[0]['item']['end'] == (dt.date.fromisoformat(os.environ['SCOPE_DAY']) + dt.timedelta(days=1)).isoformat()
          print('ONE-DAY SOURCE PLAN: PASS (candidate or already COMPLETE)')
          PY
          python -m src.ingestion.daily_cloud_workflow \
            --source openaq --region HANOI --sensor-id 13502154 \
            --as-of "$TICK_AS_OF" --lag-days 2 --lookback-days 1 \
            --max-candidates 1 --max-http-requests 3 \
            --max-bytes 2097152 --max-cloud-bytes 4194304
          echo 'CLOUD LIVE PILOT: PREVIEW PASS (no source API, no cloud writes)'
      - name: Explicitly approved one-day OpenAQ API plus cloud publication
        if: >-
          ${{ github.event_name == 'workflow_dispatch' &&
              inputs.mode == 'live_acquire' &&
              inputs.approve_source_api == true &&
              inputs.approve_cloud_upload == true }}
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$HF_TOKEN" || -z "$OPENAQ_API_KEY" ]]; then
            echo 'STOP: HF_WRITE_TOKEN and OPENAQ_API_KEY must be configured'
            exit 1
          fi
          # Existing Daily Cloud Workflow re-gates after restore, acquires
          # at most one missing UTC day and publishes Raw before manifest.
          python -m src.ingestion.daily_cloud_workflow \
            --source openaq --region HANOI --sensor-id 13502154 \
            --as-of "$TICK_AS_OF" --lag-days 2 --lookback-days 1 \
            --max-candidates 1 --max-http-requests 3 \
            --max-bytes 2097152 --max-cloud-bytes 4194304 \
            --approve-live --approve-upload
      - name: Safe outcome
        if: ${{ success() }}
        run: |
          echo 'NO SCHEDULE. Live requires manual dispatch plus two approvals and two secrets.'
          echo 'Do not interpret a preview-only green run as a live acquisition.'
