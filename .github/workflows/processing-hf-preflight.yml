name: Processing - HF Raw preflight

# Manual only. Does not modify Ingestion or write to HF.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: processing-hf-preflight
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.repository == 'phinn-19/environmental-event-bigdata' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Hugging Face CLI
        run: python -m pip install 'huggingface_hub>=2.3,<3'

      - name: Check Python syntax
        run: python -m py_compile scripts/processing_hf_preflight.py

      - name: Audit verified Raw on HF
        env:
          HF_READ_TOKEN: ${{ secrets.HF_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_READ_TOKEN" || {
            echo 'Missing HF_READ_TOKEN'
            exit 2
          }
          python scripts/processing_hf_preflight.py --max-raw-mib 256
