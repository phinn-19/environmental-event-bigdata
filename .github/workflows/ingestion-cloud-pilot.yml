name: Sprint 11 - Ingestion cloud pilot (read only)

# Push on develop enables CI before promotion. Scheduled/manual runs are
# available only once this workflow is also present on default branch (main).
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/ingestion-cloud-pilot.yml'
      - 'src/ingestion/**'
      - 'src/common/**'
      - 'tests/test_ingestion*.py'
      - 'configs/project.yaml'
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
      timezone: 'Asia/Bangkok'

permissions:
  contents: read

concurrency:
  group: ingestion-cloud-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review-only:
    name: Ingestion tests and cloud inventory (no writes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimum pilot dependencies
        run: python -m pip install 'PyYAML>=6,<7' 'huggingface_hub>=1.16,<3'
      - name: Verify Ingestion unit tests only
        run: python -m unittest discover -s tests -p 'test_ingestion*.py' -q
      - name: Preview UTC daily plan on ephemeral runner
        shell: bash
        run: |
          as_of="$(date -u +%F)"
          python -m src.ingestion.daily_cloud_workflow \
            --source era5 --region HANOI \
            --as-of "$as_of" --lag-days 7 --lookback-days 1 \
            --max-candidates 1
      - name: Read-only cloud inventory (optional secret)
        env:
          HF_TOKEN: ${{ secrets.HF_READ_TOKEN }}
        run: python -m src.ingestion.cloud_scheduler_probe --bucket CourseworkBigData/env-event-lake --prefix lake/v1
      - name: Restore and verify cloud Raw on ephemeral runner (optional secret)
        env:
          HF_TOKEN: ${{ secrets.HF_READ_TOKEN }}
        shell: bash
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo 'CLOUD RESTORE: SKIPPED (read token not configured)'
            exit 0
          fi
          python -m src.ingestion.cloud_restore --approve-download --max-bytes 8388608
          result="$(python -m src.ingestion.daily_cloud_workflow \
            --source era5 --region HANOI --as-of 2024-11-06 \
            --lag-days 1 --lookback-days 1)"
          printf '%s\n' "$result"
          grep -Fq 'LOCAL COMPLETE: 1; PENDING: 0; ACQUIRED THIS RUN: 0' <<< "$result"
      - name: State limitations
        run: |
          echo 'PILOT: READ ONLY; NO LIVE SOURCE API; NO CLOUD UPLOAD OR DELETE'
          echo 'Restore verifies bounded cloud Raw SHA-256; acquisition stays DISABLED.'
          echo 'Scheduled ingestion is disabled; restore/verify cloud state before enabling live jobs.'
